[project]
name = "harness"
version = "0.1.0"
description = "Plan-and-execute harness for Claude agents"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.166",
    "pydantic>=2",
    "typer>=0.12",
]

[project.scripts]
harness = "harness.cli:app"
agent-orchestrator = "harness.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
