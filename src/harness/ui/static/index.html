<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="harness-token" content="">
<meta name="harness-mode" content="read-only">
<title>Harness office</title>
<style>
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; color: #222; background: #fafafa; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
#layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; padding: 12px 16px; }
#left { overflow: auto; max-height: calc(100vh - 80px); min-width: 0; }
#right { min-width: 0; }
@media (max-width: 900px) { #layout { grid-template-columns: 1fr; } #left { max-height: none; } }
.chip { border: 1px solid #ccc; border-radius: 10px; padding: 1px 8px; font-size: 13px; background: #f4f4f4; }
.phase { font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.phase-running { background: #dbeafe; color: #1e40af; }
.phase-stopped { background: #fde68a; color: #78350f; }
.phase-finished { background: #d1fae5; color: #065f46; }
#banner { padding: 8px 16px; background: #fff3cd; border-bottom: 1px solid #e0c36a; }
#banner:empty { display: none; }
table { border-collapse: collapse; width: 100%; background: #fff; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #e5e5e5; vertical-align: top; font-size: 14px; }
th { background: #f0f0f0; }
.status { font-weight: 600; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.status-pending { background: #e5e7eb; color: #4b5563; }
.status-running { background: #dbeafe; color: #1d4ed8; }
.status-verifying { background: #ede9fe; color: #6d28d9; }
.status-done { background: #d1fae5; color: #047857; }
.status-failed { background: #fee2e2; color: #b91c1c; }
.status-blocked { background: #f5c6c6; color: #7f1d1d; }
.status-paused { background: #fef3c7; color: #92400e; }
.activity, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.activity { color: #6b7280; font-size: 13px; }
pre { white-space: pre-wrap; margin: 4px 0 0; }
#feed { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; }
#feed li { padding: 2px 0; border-bottom: 1px solid #eee; }
#feed .time { color: #6b7280; margin-right: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; }
#feed .tid { margin-right: 6px; }
.hidden { display: none; }
#office { padding: 8px 0 14px; }
.teacher { display: flex; justify-content: center; padding-bottom: 12px; margin-bottom: 6px; border-bottom: 2px solid #e5e7eb; }
.row { display: flex; gap: 12px; align-items: flex-end; margin-top: 10px; }
.row.hidden { display: none; }
.row-label { flex: none; width: 56px; padding-bottom: 8px; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; }
.row-desks { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
.desk { position: relative; width: 132px; padding-top: 74px; text-align: center; }
.desk-label { font-size: 12px; margin-top: 6px; color: #374151; word-break: break-all; }
.desk[data-task] { cursor: pointer; }
.desk.selected .desk-top { box-shadow: 0 0 0 3px #f59e0b; }
.desk-top { height: 30px; border-radius: 4px; border: 2px solid #9ca3af; background: #e5e7eb; position: relative; }
.desk-top::before { content: ""; position: absolute; left: 50%; top: -14px; width: 26px; height: 12px; margin-left: -13px; border: 2px solid #9ca3af; border-radius: 2px; background: #f9fafb; }
.worker { position: absolute; left: 50%; top: 34px; width: 28px; margin-left: -14px; height: 40px; display: none; }
.worker::before { content: ""; position: absolute; left: 7px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #6b7280; }
.worker::after { content: ""; position: absolute; left: 2px; top: 16px; width: 24px; height: 20px; border-radius: 10px 10px 0 0; background: #6b7280; }
.desk-running .worker, .desk-verifying .worker, .desk-paused .worker, .desk-done .worker, .desk-failed .worker, .desk-blocked .worker, .desk-boss .worker { display: block; }
.desk-done .worker, .desk-failed .worker, .desk-blocked .worker { opacity: 0; animation: walk-out 0.8s ease-in forwards; }
.desk-running .worker, .desk-verifying .worker { animation: walk-in 0.8s ease-out, type 0.7s ease-in-out 0.8s infinite; }
.settled .worker { animation: none; }
@keyframes walk-in { from { transform: translateX(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes walk-out { from { transform: none; opacity: 1; } to { transform: translateX(80px); opacity: 0; } }
@keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
.desk-pending .desk-top { border-style: dashed; background: #f3f4f6; border-color: #d1d5db; }
.desk-running .desk-top { border-color: #2563eb; background: #dbeafe; }
.desk-verifying .desk-top { border-color: #7c3aed; background: #ede9fe; }
.desk-done .desk-top { border-color: #059669; background: #a7f3d0; }
.desk-failed .desk-top { border-color: #dc2626; background: #fecaca; }
.desk-blocked .desk-top { border-color: #991b1b; background: #fca5a5; }
.desk-paused .desk-top { border-color: #d97706; background: #fde68a; }
.desk-boss .desk-top { border-color: #374151; background: #d1d5db; }
.desk-boss .worker::before, .desk-boss .worker::after { background: #1f2937; }
.bubble { position: absolute; left: 0; right: 0; top: 0; min-height: 18px; padding: 2px 6px; border: 1px solid #9ca3af; border-radius: 8px; background: #fff; font-size: 11px; line-height: 14px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; width: 8px; height: 8px; background: #fff; border-right: 1px solid #9ca3af; border-bottom: 1px solid #9ca3af; transform: rotate(45deg); }
.bubble-running { border-color: #2563eb; }
.bubble-verifying { border-color: #7c3aed; }
.bubble-paused { border-color: #d97706; }
.desk-boss.clickable { cursor: pointer; }
.desk-boss.clickable:hover .desk-top { filter: brightness(0.94); }
.boss-busy .desk-top, .boss-staging .desk-top { border-color: #2563eb; background: #dbeafe; }
.boss-asking .desk-top { border-color: #d97706; background: #fde68a; }
.boss-ready .desk-top { animation: flash 1s infinite; }
@keyframes flash { 0%, 100% { background: #d1d5db; } 50% { background: #fde047; } }
.boss-supervising .desk-top { border-color: #059669; background: #a7f3d0; }
.boss-failed .desk-top { border-color: #dc2626; background: #fecaca; }
.boss-interrupted .desk-top { border-color: #d97706; background: #fed7aa; }
.boss-terminal .desk-top { border-color: #7c3aed; background: #ede9fe; }
.bubble-boss { border-color: #374151; }
.desk-orch { cursor: pointer; }
.desk-orch .worker { display: block; }
.desk-orch .worker::before, .desk-orch .worker::after { background: #1f2937; }
.orch-idle .desk-top { border-color: #374151; background: #d1d5db; }
.orch-routing .desk-top { border-color: #2563eb; background: #dbeafe; }
.orch-failed .desk-top { border-color: #dc2626; background: #fecaca; }
.orch-routing .mark::before { content: "\2022\2022\2022"; color: #2563eb; animation: think 1.2s ease-in-out infinite; }
.bubble-orch { border-color: #374151; }
.desk-chat { cursor: pointer; }
.chat-working .worker, .chat-waiting .worker { display: block; }
.chat-working .worker { animation: type 0.7s ease-in-out infinite; }
.chat-free .desk-top { border-style: dashed; background: #f3f4f6; border-color: #d1d5db; }
.chat-working .desk-top { border-color: #2563eb; background: #dbeafe; }
.chat-waiting .desk-top { border-color: #059669; background: #d1fae5; }
.bubble-chat { border-color: #059669; }
.mark { position: absolute; left: 50%; top: 24px; margin-left: 16px; font-size: 16px; font-weight: 700; line-height: 16px; color: #d97706; }
.mark::before { display: inline-block; }
.boss-busy .mark::before, .boss-staging .mark::before { content: "\2022\2022\2022"; color: #2563eb; animation: think 1.2s ease-in-out infinite; }
.boss-asking .mark::before { content: "?"; animation: ask 0.9s ease-in-out infinite; }
.boss-supervising .worker::before { animation: watch 3s ease-in-out infinite; }
@keyframes think { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@keyframes ask { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes watch { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.boss-ready .bubble-boss, .boss-asking .bubble-boss { border-color: #d97706; font-weight: 600; }
.muted { color: #6b7280; }
.convo-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; }
#office-msg { color: #b91c1c; font-weight: 600; min-height: 1em; }
#office-msg:empty { display: none; }
#office-note { color: #78350f; background: #fff3cd; padding: 4px 8px; border-radius: 4px; }
#office-note:empty { display: none; }
#triage-line { margin: 0 0 8px; }
#triage-line:empty { display: none; }
#composer textarea { width: 100%; box-sizing: border-box; font: inherit; margin: 6px 0; }
#composer button { font: inherit; padding: 4px 12px; margin-right: 8px; cursor: pointer; }
#composer button:disabled { cursor: default; opacity: 0.55; }
#plan-fold { margin-top: 10px; }
#plan-fold > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.md { font-size: 14px; line-height: 1.45; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 6px; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p { margin: 6px 0; }
.md li > p { margin: 0; }
.md table { width: auto; margin: 8px 0; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #f3f4f6; padding: 0 3px; border-radius: 3px; }
.md pre { background: #f3f4f6; padding: 8px; border-radius: 4px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid #d1d5db; color: #4b5563; }
#progress { list-style: none; padding: 0; margin: 6px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #4b5563; }
details.fold { margin-top: 10px; }
details.fold > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
#transcript { list-style: none; padding: 0; margin: 0; }
.msg { margin: 0 0 10px; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; }
.msg-user { background: #eff6ff; border-color: #bfdbfe; }
.msg-who { font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 2px; }
.msg-text { white-space: pre-wrap; font-size: 14px; }
#btn-back-opus { font: inherit; padding: 2px 10px; cursor: pointer; }
#timeline { list-style: none; padding: 0; margin: 0; font-size: 13px; }
#timeline li { padding: 3px 0; border-bottom: 1px solid #eee; }
#timeline .time { color: #6b7280; margin-right: 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
#timeline .step-attempt { font-weight: 600; color: #374151; padding-top: 8px; }
#timeline .step.current { font-weight: 600; color: #1d4ed8; }
#chat-transcript { list-style: none; padding: 0; margin: 0; }
.msg-agent { background: #f0fdf4; border-color: #bbf7d0; }
#chat-progress, #chat-commits { list-style: none; padding: 0; margin: 6px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #4b5563; }
#chat-note { color: #78350f; background: #fff3cd; padding: 4px 8px; border-radius: 4px; }
#chat-note:empty { display: none; }
#chat-msg { color: #b91c1c; font-weight: 600; }
#chat-msg:empty { display: none; }
#chat-text { width: 100%; box-sizing: border-box; font: inherit; margin: 6px 0; }
#chat-view button { font: inherit; padding: 4px 12px; margin-right: 8px; cursor: pointer; }
#chat-view button:disabled { cursor: default; opacity: 0.55; }
#orch-transcript { list-style: none; padding: 0; margin: 0; }
.msg-orch { background: #f9fafb; border-color: #d1d5db; }
#orch-line { margin: 0 0 8px; }
#orch-line:empty { display: none; }
#office-total { font-weight: 600; }
#btn-convo-back { font: inherit; padding: 2px 10px; cursor: pointer; }
#orch-msg { color: #b91c1c; font-weight: 600; }
#orch-msg:empty { display: none; }
#orch-text { width: 100%; box-sizing: border-box; font: inherit; margin: 6px 0; }
#orch-view button { font: inherit; padding: 4px 12px; margin-right: 8px; cursor: pointer; }
#orch-view button:disabled { cursor: default; opacity: 0.55; }
#project-view { padding: 12px 16px; max-width: 900px; }
#project-view h2 { margin: 4px 0 8px; font-size: 18px; }
#project-view h3 { margin: 14px 0 4px; font-size: 14px; }
#fs-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#fs-path { flex: 1 1 300px; min-width: 0; font: inherit; padding: 3px 6px; }
#fs-list, #recent-list { list-style: none; padding: 0; margin: 8px 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
#fs-list { max-height: 45vh; overflow: auto; }
#fs-list li, #recent-list li { padding: 5px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
#fs-list li[role="button"], #recent-list li[role="button"] { cursor: pointer; }
#fs-list li[role="button"]:hover, #recent-list li[role="button"]:hover { background: #f3f4f6; }
#recent-list:empty { display: none; }
.fs-git { color: #047857; font-size: 12px; margin-left: 8px; }
#project-info { margin: 8px 0; font-size: 14px; }
#project-msg { color: #b91c1c; font-weight: 600; }
#project-msg:empty { display: none; }
#project-view button, header button { font: inherit; padding: 4px 12px; cursor: pointer; }
#project-view button:disabled, header button:disabled { cursor: default; opacity: 0.55; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header>
  <select id="run-picker" aria-label="Run"></select>
  <span id="stage"></span>
  <span id="phase" class="phase"></span>
  <span id="wave"></span>
  <span id="cost"></span>
  <span id="tiers"></span>
  <span id="office-total"></span>
  <span id="project-name" class="chip hidden"></span>
  <button id="btn-switch-project" type="button" class="hidden">Switch project</button>
</header>
<div id="banner"></div>
<main id="layout">
  <section id="left">
    <div id="orch-view">
      <div class="convo-head">
        <strong>Orchestrator</strong>
        <span id="orch-cost" class="muted"></span>
      </div>
      <ol id="orch-transcript"></ol>
      <p id="orch-line" class="muted"></p>
      <div id="orch-composer" class="hidden">
        <p id="orch-msg" role="alert"></p>
        <textarea id="orch-text" rows="4" placeholder="Ask the office for anything"></textarea>
        <select id="orch-route" aria-label="Who takes it">
          <option value="orchestrator">Orchestrator decides</option>
          <option value="quick">Opus: quick plan</option>
          <option value="project">Opus: project plan</option>
        </select>
        <button id="btn-orch-send" type="button">Send</button>
        <button id="btn-orch-new" type="button">New request</button>
      </div>
    </div>
    <div id="convo" class="hidden">
      <div class="convo-head">
        <button id="btn-convo-back" type="button">Back to Orchestrator</button>
        <strong id="office-title">Opus</strong>
        <span id="office-cost" class="muted"></span>
      </div>
      <ol id="transcript"></ol>
      <p id="triage-line" class="muted"></p>
      <div id="composer" class="hidden">
        <p id="office-note"></p>
        <p id="office-msg" role="alert"></p>
        <button id="btn-resume-run" type="button" class="hidden">Resume run</button>
        <section id="sec-prompt" class="hidden">
          <label for="desc">What should Opus plan?</label>
          <textarea id="desc" rows="7" placeholder="Describe the project in a few sentences"></textarea>
          <select id="route" aria-label="Route">
            <option value="quick">Quick plan</option>
            <option value="project">Full plan</option>
          </select>
          <button id="btn-start" type="button">Start planning</button>
        </section>
        <section id="sec-status" class="hidden">
          <p id="status-line"></p>
          <ul id="progress"></ul>
        </section>
        <section id="sec-reply" class="hidden">
          <textarea id="answer" rows="4" placeholder="Your answer"></textarea>
          <button id="btn-send" type="button">Send</button>
        </section>
        <section id="sec-plan" class="hidden">
          <textarea id="continue" rows="3" placeholder="Ask for changes"></textarea>
          <button id="btn-continue" type="button">Continue conversation</button>
          <button id="btn-implement" type="button">Start implementing</button>
        </section>
        <section id="sec-failed" class="hidden">
          <p id="failed-line"></p>
          <button id="btn-resume" type="button">Continue from draft</button>
          <button id="btn-fresh" type="button">Start fresh</button>
        </section>
        <section id="sec-next" class="hidden">
          <p id="next-line"></p>
          <button id="btn-next" type="button">Plan next stage</button>
          <button id="btn-new" type="button">New project</button>
        </section>
      </div>
      <details id="plan-fold" class="hidden"><summary>Plan</summary><div id="plan-body" class="md"></div></details>
    </div>
    <div id="timeline-view" class="hidden">
      <div class="convo-head">
        <button id="btn-back-opus" type="button">Back to Orchestrator</button>
        <strong id="tl-title"></strong>
        <button id="btn-tl-chat" type="button" class="hidden">Chat</button>
      </div>
      <p id="tl-meta" class="muted"></p>
      <ol id="timeline"></ol>
    </div>
    <div id="chat-view" class="hidden">
      <div class="convo-head">
        <button id="btn-chat-back" type="button">Back to Orchestrator</button>
        <strong id="chat-title"></strong>
        <span id="chat-cost" class="muted"></span>
      </div>
      <ol id="chat-transcript"></ol>
      <ul id="chat-progress"></ul>
      <ul id="chat-commits"></ul>
      <p id="chat-note"></p>
      <p id="chat-msg" role="alert"></p>
      <textarea id="chat-text" rows="4" placeholder="Message the agent"></textarea>
      <button id="btn-chat-send" type="button">Send</button>
      <button id="btn-chat-close" type="button" class="hidden">Close chat</button>
    </div>
  </section>
  <section id="right">
    <div id="office" aria-label="Office">
      <div id="teacher" class="teacher"></div>
      <div id="row-opus" class="row row-opus hidden"><div class="row-label">opus</div><div id="desks-opus" class="row-desks"></div></div>
      <div id="row-sonnet" class="row row-sonnet hidden"><div class="row-label">sonnet</div><div id="desks-sonnet" class="row-desks"></div></div>
      <div id="row-haiku" class="row row-haiku hidden"><div class="row-label">haiku</div><div id="desks-haiku" class="row-desks"></div></div>
    </div>
    <p id="empty" class="hidden">No runs yet</p>
    <div id="content">
      <details class="fold">
        <summary>Tasks</summary>
        <table id="tasks">
          <thead><tr><th>Task</th><th>Status</th><th>Tier</th><th>Attempt</th><th>Tokens</th><th>Cost</th><th>Note</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
      <details class="fold">
        <summary>Events</summary>
        <ol id="feed"></ol>
      </details>
    </div>
  </section>
</main>
<section id="project-view" class="hidden">
  <h2>Open a project</h2>
  <div id="fs-bar">
    <button id="btn-fs-up" type="button">Up</button>
    <input id="fs-path" type="text" aria-label="Folder path" spellcheck="false">
    <button id="btn-fs-go" type="button">Go</button>
    <label><input id="fs-hidden" type="checkbox"> Show hidden folders</label>
  </div>
  <ul id="fs-list"></ul>
  <button id="btn-fs-open" type="button">Open this folder</button>
  <button id="btn-project-back" type="button" class="hidden">Back</button>
  <h3>Recent</h3>
  <ul id="recent-list"></ul>
  <p id="project-info"></p>
  <p id="project-msg" role="alert"></p>
</section>
<script>
(function () {
  var picker = document.getElementById('run-picker');
  var runs = [], latest = null, current = null, source = null;
  var conn = false, problem = null, stopped = null, idle = null;
  var tokenMeta = document.querySelector('meta[name="harness-token"]');
  var modeMeta = document.querySelector('meta[name="harness-mode"]');
  var token = tokenMeta ? (tokenMeta.getAttribute('content') || '') : '';
  var interactive = !!modeMeta && modeMeta.getAttribute('content') === 'interactive';
  var office = null, officeSig = '', runView = null, planBlocks = null, planSeq = 0, planKey = '';
  var lastAutoRun = null, autoInit = false;
  var shownSession = null, shownCount = 0;
  var forcePrompt = false, lastState = null;
  var deskNodes = {}, bossNode = null, orchNode = null, selectedTask = null;
  var tlTask = null, tlFirst = null, tlCount = 0, tlAttempt = null, tlLast = null;
  var chatTier = null, chatId = null, chatShown = null, chatCount = 0;
  var chatDesks = {}, lastHandoff = null, chatSeed = null;
  var orchShown = null, orchCount = 0;
  var hostMode = false, project = null, recent = [], serverStarted = null, fsDir = null;

  function needsTid(id, text) {
    // describe text already starts with the task id (e.g. "a started on haiku")
    return id !== null && id !== undefined && String(text).indexOf(String(id) + ' ') !== 0;
  }
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  var FINISHED = {done: true, failed: true, blocked: true};

  function orchText(v) {

      orchNode.appendChild(el('div', 'mark'));

  function taskDesk(t) {
    // a desk first seen finished is settled: its worker never walks out on screen
    var id = t.task_id;
    var d = el('div', FINISHED[t.status] ? 'settled' : '');
    d.setAttribute('data-task', str(id));
    d.setAttribute('role', 'button');
    d.tabIndex = 0;
    d.appendChild(el('div', 'bubble hidden'));
    d.appendChild(el('div', 'worker'));
    d.appendChild(el('div', 'desk-top'));
    d.appendChild(el('div', 'desk-label'));
    d.addEventListener('click', function () { selectTask(id); });
    d.addEventListener('keydown', onKey(function () { selectTask(id); }));
    return d;
  }

  function bubbleText(t) {
    if (t.status === 'paused') return 'paused';
    var steps = Array.isArray(t.steps) ? t.steps : [];
    var last = steps.length ? steps[steps.length - 1] : null;
    if (last && last.text) return String(last.text);
    return t.activity ? String(t.activity) : 'awaiting';
  }

  function updateDesk(d, t) {
    var st = str(t.status);
    var settled = !!FINISHED[st] && (' ' + d.className + ' ').indexOf(' settled ') >= 0;
    setClass(d, 'desk desk-' + st + (settled ? ' settled' : '') + (selectedTask === t.task_id ? ' selected' : ''));
    var talking = st === 'running' || st === 'verifying' || st === 'paused';
    setClass(d.children[0], 'bubble bubble-' + st + (talking ? '' : ' hidden'));
    if (talking) setText(d.children[0], bubbleText(t));
    setText(d.children[3], (t.tier ? t.tier : '-') + ' · ' + str(t.task_id));
    var box = document.getElementById('desks-' + rowOf(t));
    if (d.parentNode !== box) box.appendChild(d);
  }

  function rowOf(t) {
    // the row a task sits in: its tier, with a null or unknown tier in the sonnet row
    var tier = t ? t.tier : null;
    return (tier === 'opus' || tier === 'haiku') ? tier : 'sonnet';
  }

  function chatDesk(tier) {
    // a free agent desk: click to chat with a haiku or sonnet agent
    var d = el('div', 'desk desk-chat');
    d.id = 'desk-chat-' + tier;
    d.setAttribute('role', 'button');
    d.setAttribute('title', 'Chat with ' + tier);
    d.tabIndex = 0;
    d.appendChild(el('div', 'bubble bubble-chat hidden'));
    d.appendChild(el('div', 'worker'));
    d.appendChild(el('div', 'desk-top'));
    d.appendChild(el('div', 'desk-label', tier + ' · chat'));
    d.addEventListener('click', function () { openChatPanel(tier); });
    d.addEventListener('keydown', onKey(function () { openChatPanel(tier); }));
    return d;
  }

  function chatBubble(chat) {
    if (!chat) return '';
    if (chat.state === 'waiting') return 'your turn';
    var p = Array.isArray(chat.progress) ? chat.progress : [];
    return p.length ? String(p[p.length - 1]) : 'working…';
  }

  function updateChatDesk(d, tier) {
    var chat = openChat(office ? office.chats : [], tier);
    var st = chat ? chat.state : 'free';
    setClass(d, 'desk desk-chat chat-' + st + (chatTier === tier ? ' selected' : ''));
    var text = chatBubble(chat);
    setClass(d.children[0], 'bubble bubble-chat' + (text ? '' : ' hidden'));
    setText(d.children[0], text);
    var box = document.getElementById('desks-' + tier);
    if (d.parentNode !== box) box.appendChild(d);
  }

  function renderOffice() {
    // desks are keyed by task id and updated in place, so animations play once
    orchDesk();
    bossDesk();
    var tasks = runView ? (runView.tasks || []) : [];
    var seen = {};
    tasks.forEach(function (t) {
      var id = str(t.task_id);
      seen[id] = true;
      if (!deskNodes[id]) deskNodes[id] = taskDesk(t);
      updateDesk(deskNodes[id], t);
    });
    Object.keys(deskNodes).forEach(function (id) {
      if (seen[id]) return;
      var d = deskNodes[id];
      if (d.parentNode) d.parentNode.removeChild(d);
      delete deskNodes[id];
    });
    if (interactive) {
      ['sonnet', 'haiku'].forEach(function (tier) {
        if (!chatDesks[tier]) chatDesks[tier] = chatDesk(tier);
        updateChatDesk(chatDesks[tier], tier);
      });
    }
    ['opus', 'sonnet', 'haiku'].forEach(function (r) {
      var empty = document.getElementById('desks-' + r).children.length === 0;
      setClass(document.getElementById('row-' + r), 'row row-' + r + (empty ? ' hidden' : ''));
    });
  }

  function selectTask(id) {
    // a task id shows its timeline in the left panel; null shows the Orchestrator
    selectedTask = (id === undefined) ? null : id;
    chatTier = null;
    tlTask = null;
    showPanel(selectedTask === null ? 'orch-view' : 'timeline-view');
    renderTimeline();
    renderOffice();
  }

  // ---- markdown block tree -> DOM (textContent only; links are never anchors)
  function inlineNode(sp) {
    var t = sp.t, text = (sp.text === null || sp.text === undefined) ? '' : String(sp.text);
    if (t === 'strong') return el('strong', null, text);
    if (t === 'em') return el('em', null, text);
    if (t === 'code') return el('code', null, text);
    if (t === 'link') {
      var f = document.createDocumentFragment();
      f.appendChild(document.createTextNode(text));
      f.appendChild(el('span', 'muted', ' (' + str(sp.href) + ')'));
      return f;
    }
    return document.createTextNode(text);
  }
  function appendInline(parent, spans) {
    (Array.isArray(spans) ? spans : []).forEach(function (sp) { parent.appendChild(inlineNode(sp)); });
  }
  function renderBlock(b) {
    var type = b && b.type, n, i;
    if (type === 'heading') {
      var lv = Math.min(6, Math.max(1, Number(b.level) || 1));
      n = el('h' + lv);
      appendInline(n, b.inline);
      return n;
    }
    if (type === 'paragraph') {
      n = el('p');
      appendInline(n, b.inline);
      return n;
    }
    if (type === 'list') {
      n = el(b.ordered ? 'ol' : 'ul');
      (b.items || []).forEach(function (blocks) {
        var li = el('li');
        li.appendChild(renderBlocks(blocks));
        n.appendChild(li);
      });
      return n;
    }
    if (type === 'code') {
      n = el('pre');
      n.appendChild(el('code', null, str(b.text)));
      return n;
    }
    if (type === 'table') {
      n = el('table');
      var head = el('tr');
      (b.header || []).forEach(function (cell) { var th = el('th'); appendInline(th, cell); head.appendChild(th); });
      var thead = el('thead');
      thead.appendChild(head);
      n.appendChild(thead);
      var tbody = el('tbody');
      (b.rows || []).forEach(function (row) {
        var tr = el('tr');
        for (i = 0; i < row.length; i++) { var td = el('td'); appendInline(td, row[i]); tr.appendChild(td); }
        tbody.appendChild(tr);
      });
      n.appendChild(tbody);
      return n;
    }
    if (type === 'quote') {
      n = el('blockquote');
      n.appendChild(renderBlocks(b.blocks));
      return n;
    }
    if (type === 'hr') return el('hr');
    return null;
  }
  function renderBlocks(blocks) {
    var frag = document.createDocumentFragment();
    (Array.isArray(blocks) ? blocks : []).forEach(function (b) {
      var n = renderBlock(b);
      if (n) frag.appendChild(n);
    });
    return frag;
  }
  function fill(id, blocks) {
    var node = document.getElementById(id);
    node.replaceChildren(renderBlocks(blocks));
  }

  // ---- the conversation with Opus, appended in place
  function msgNode(entry, who) {
    // `who` names a chat agent; without it the other side is Opus or the Orchestrator
    var user = entry.role === 'user', orch = entry.role === 'orchestrator';
    var li = el('li', 'msg ' + (user ? 'msg-user' : orch ? 'msg-orch' : who ? 'msg-agent' : 'msg-opus'));
    li.appendChild(el('div', 'msg-who', user ? 'You' : orch ? 'Orchestrator' : who || 'Opus'));
    if (user) {
      li.appendChild(el('div', 'msg-text', entry.text === null || entry.text === undefined ? '' : String(entry.text)));
    } else {
      var md = el('div', 'md');
      md.appendChild(renderBlocks(entry.blocks));
      li.appendChild(md);
    }
    return li;
  }

  function renderTranscript(o) {
    var list = document.getElementById('transcript');
    var entries = Array.isArray(o.transcript) ? o.transcript : [];
    var sid = o.session_id || null;
    if (sid !== shownSession || entries.length < shownCount) {
      list.replaceChildren();
      shownSession = sid;
      shownCount = 0;
    }
    if (entries.length === shownCount) return;
    var left = document.getElementById('left');
    var atBottom = left.scrollHeight - left.scrollTop - left.clientHeight <= 40;
    for (var i = shownCount; i < entries.length; i++) list.appendChild(msgNode(entries[i]));
    shownCount = entries.length;
    if (atBottom) left.scrollTop = left.scrollHeight;
  }

  // ---- the Orchestrator's thread, appended in place
  function orchCostText(v) {
    return v && v.cost_usd > 0 ? 'orchestrator ' + money(v.cost_usd) : '';
  }

  function totalText(o) {
    return o && o.total_cost_usd > 0 ? 'office ' + money(o.total_cost_usd) : '';
  }

  function orchLine(v) {
    // the agent that holds the work, if any
    return v && v.holder ? 'With ' + v.holder + ' (' + str(v.holder_id) + ')' : '';
  }

  function orchSend(v, route, text) {
    // a follow-up (someone holds the work) and "Orchestrator decides" go to the
    // Orchestrator; "Opus: quick plan" and "Opus: project plan" start Opus directly
    if ((v && v.holder) || (route !== 'quick' && route !== 'project')) {
      return {path: '/api/orchestrator/message', body: {text: text}};
    }
    return {path: '/api/planner/start', body: {description: text, route: route}};
  }

  function wireOrch() {
    byId('btn-orch-send').addEventListener('click', function () {
      var text = textOf('orch-text');
      if (!text) { byId('orch-msg').textContent = 'Write a message first.'; return; }
      var req = orchSend(office ? office.orchestrator : null, byId('orch-route').value, text);
      act(req.path, req.body, function () {
        byId('orch-text').value = '';
        byId('orch-route').value = 'orchestrator';
        if (req.path === '/api/planner/start') showOpus();
      }, 'orch-msg');
    });
    byId('btn-orch-new').addEventListener('click', function () {
      act('/api/orchestrator/new', {}, null, 'orch-msg');
    });
  }

  function renderOrch(v) {
    var o = v || {};
    setHidden('orch-composer', !interactive);
    setHidden('orch-route', !!o.holder);
    byId('orch-cost').textContent = orchCostText(o);
    byId('orch-line').textContent = orchLine(o);
    var list = byId('orch-transcript');
    var entries = Array.isArray(o.transcript) ? o.transcript : [];
    var tid = o.thread_id || null;
    if (tid !== orchShown || entries.length < orchCount) {
      list.replaceChildren();
      orchShown = tid;
      orchCount = 0;
    }
    if (entries.length === orchCount) return;
    var left = byId('left');
    var atBottom = left.scrollHeight - left.scrollTop - left.clientHeight <= 40;
    for (var i = orchCount; i < entries.length; i++) {
      var e = entries[i];
      list.appendChild(msgNode(e, e.role === 'agent' ? str(e.who) : null));
    }
    orchCount = entries.length;
    if (atBottom) left.scrollTop = left.scrollHeight;
  }

  // ---- a worker's timeline, appended in place
  function stepKey(s, i) { return s.ts + '|' + i; }

  function findTask(id) {
    var tasks = runView ? (runView.tasks || []) : [];
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i].task_id === id) return tasks[i];
    }
    return null;
  }

  function stepNode(s) {
    var li = el('li', 'step');
    li.appendChild(el('span', 'time', typeof s.ts === 'string' ? s.ts.slice(11, 19) : '?'));
    li.appendChild(document.createTextNode(s.text === null || s.text === undefined ? '' : String(s.text)));
    return li;
  }

  function chatTierOf(tier) {
    // the chat agent that picks up a worker's task: haiku for haiku, else sonnet
    return tier === 'haiku' ? 'haiku' : 'sonnet';
  }

  function renderTimeline() {
    if (selectedTask === null) return;
    var t = findTask(selectedTask) || {task_id: selectedTask, steps: []};
    var chat = byId('btn-tl-chat');
    chat.className = interactive ? '' : 'hidden';
    chat.textContent = 'Chat with ' + chatTierOf(t.tier);
    var max =(t.max_attempts === null || t.max_attempts === undefined) ? '?' : num(t.max_attempts);
    byId('tl-title').textContent = str(t.task_id) + ' · ' + (t.title === null || t.title === undefined ? '' : String(t.title));
    byId('tl-meta').textContent = (t.tier ? t.tier : '-') + ' · ' + str(t.status) + ' · attempt ' + num(t.attempt) + '/' + max;
    var list = byId('timeline');
    var steps = Array.isArray(t.steps) ? t.steps : [];
    var first = steps.length ? stepKey(steps[0], 0) : null;
    if (t.task_id !== tlTask || first !== tlFirst || steps.length < tlCount) {
      list.replaceChildren();
      tlTask = t.task_id;
      tlFirst = first;
      tlCount = 0;
      tlAttempt = null;
      tlLast = null;
      if (!steps.length) list.appendChild(el('li', 'step-empty muted', 'No steps yet'));
    }
    var left = byId('left');
    var atBottom = left.scrollHeight - left.scrollTop - left.clientHeight <= 40;
    var added = steps.length > tlCount;
    for (var i = tlCount; i < steps.length; i++) {
      var s = steps[i];
      if (i === 0 || s.attempt !== tlAttempt) {
        list.appendChild(el('li', 'step-attempt', 'attempt ' + num(s.attempt) + ' on ' + (s.tier ? s.tier : '-')));
      }
      tlAttempt = s.attempt;
      if (tlLast) tlLast.className = 'step';
      tlLast = stepNode(s);
      list.appendChild(tlLast);
    }
    tlCount = steps.length;
    if (tlLast) tlLast.className = t.status === 'running' ? 'step current' : 'step';
    if (added && atBottom) left.scrollTop = left.scrollHeight;
  }

  // ---- the composer and the plan, below the conversation
  function byId(id) { return document.getElementById(id); }
  function setHidden(id, hide) { byId(id).classList.toggle('hidden', hide); }

  function pickSection(o) {
    var st = o.state;
    if (st === 'idle') return (o.next_stage && !forcePrompt) ? 'next' : 'prompt';
    if (st === 'interrupted' || st === 'failed') return forcePrompt ? 'prompt' : 'failed';
    if (st === 'asking') return 'reply';
    if (st === 'ready') return 'plan';
    return 'status';
  }

  function statusLine(o) {
    if (o.state === 'busy') return 'The planner is working\u2026';
    if (o.state === 'staging') return 'The planner is writing the stage work orders\u2026';
    if (o.state === 'supervising') return 'Supervising run ' + str(o.run_id) + '. Planning is paused until it finishes.';
    if (o.state === 'terminal') return 'A planner is busy in a terminal; wait for it to finish.';
    return str(o.state);
  }

  function triageText(o) {
    // set only when the triage picked the route (route "auto")
    if (!o || typeof o.triage_reason !== 'string' || !o.route) return '';
    return 'Triage routed this: ' + o.route + ' (' + o.triage_reason + ')';
  }

  function canImplement(o) {
    // a quick plan starts once its plan.json is written; a project once its plan is a draft
    if (o.plan_kind === 'quick') return typeof o.quick_plan === 'string';
    return o.plan_status === 'draft';
  }

  function resumeLabel(o) {
    return typeof o.resumable_run === 'string' ? 'Resume run ' + o.resumable_run : '';
  }

  function renderComposer() {
    var o = office;
    if (!o) return;
    if (o.state !== 'idle' && o.state !== 'interrupted' && o.state !== 'failed') forcePrompt = false;
    setHidden('composer', !interactive);
    var which = pickSection(o);
    ['prompt', 'status', 'reply', 'plan', 'failed', 'next'].forEach(function (name) {
      setHidden('sec-' + name, name !== which);
    });
    byId('office-title').textContent = 'Opus \u00b7 ' + str(o.state) + (o.stage ? ' (stage ' + o.stage + ')' : '');
    byId('office-cost').textContent = o.cost_usd > 0 ? 'planner cost ' + money(o.cost_usd) : '';
    byId('office-note').textContent = o.error ? String(o.error) : '';
    byId('triage-line').textContent = triageText(o);
    var resume = resumeLabel(o);
    setHidden('btn-resume-run', !resume);
    if (resume) byId('btn-resume-run').textContent = resume;
    if (which === 'status') {
      byId('status-line').textContent = statusLine(o);
      var shown = (o.state === 'busy' || o.state === 'staging') ? (o.progress || []) : [];
      var items = shown.map(function (line) { return el('li', null, line); });

      setHidden('btn-implement', !canImplement(o));

    }
    if (which === 'failed') {
      byId('failed-line').textContent = o.state === 'failed' ? 'The planner stopped.' : 'The planning session was closed.';
      setHidden('btn-resume', !o.plan_exists);
    }
    if (which === 'next') {
      byId('next-line').textContent = 'The last run finished. Plan the next stage of the approved project plan, or start a new project.';
      byId('btn-next').textContent = 'Plan next stage (' + str(o.next_stage) + ')';
    }
    renderPlanFold(o);
  }

  function renderPlanFold(o) {
    // GET /api/plan serves the quick plan's plan.md while quick_plan is set
    var shown = !!o.plan_exists || typeof o.quick_plan === 'string';
    setHidden('plan-fold', !shown);
    if (o.state === 'ready' && lastState !== 'ready') byId('plan-fold').open = true;
    lastState = o.state;
    var key = [o.plan_status, o.state, o.cost_usd, o.quick_plan].join('|');
    if (shown && key !== planKey) {
      planKey = key;
      loadPlan();
    }
  }

  function fillPlan() {
    if (planBlocks === null) return;
    fill('plan-body', planBlocks);
  }

  function loadPlan() {
    var seq = ++planSeq;
    fetch('/api/plan').then(function (r) { return r.json(); }).then(function (p) {
      if (seq !== planSeq) return;
      planBlocks = (p && p.exists && Array.isArray(p.blocks)) ? p.blocks : [];
      fillPlan();
    }).catch(function () { /* the next change retries */ });
  }

  function focusComposer() {
    // the boss desk: focus the textarea of the section on show, if it has one
    if (!interactive) return;
    var ids = ['desc', 'answer', 'continue'];
    for (var i = 0; i < ids.length; i++) {
      var box = byId(ids[i]);
      if (!box.parentNode.classList.contains('hidden')) { box.focus(); return; }
    }
  }

  function setBusy(on) {
    var buttons = document.querySelectorAll('#composer button, #chat-view button, #orch-view button');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = on;
  }

  function api(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Harness-Token': token},
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        var data = null;
        try { data = JSON.parse(t); } catch (e) { data = null; }
        return {ok: r.ok, status: r.status, data: data};
      });
    });
  }

  function act(path, body, done, msgId) {
    var msg = byId(msgId || 'office-msg');
    msg.textContent = '';
    setBusy(true);
    api(path, body).then(function (res) {
      setBusy(false);
      if (!res.ok) {
        msg.textContent = (res.data && res.data.error) ? String(res.data.error) : 'Request failed (HTTP ' + res.status + ')';
        return;
      }
      if (done) done();
      if (res.data && res.data.office) applyOffice(res.data.office);
    }).catch(function () {
      setBusy(false);
      msg.textContent = 'Connection lost; try again.';
    });
  }

  function textOf(id) { return byId(id).value.replace(/^\s+|\s+$/g, ''); }

  function send(id) {
    var text = textOf(id);
    if (!text) { byId('office-msg').textContent = 'Write a message first.'; return; }
    act('/api/planner/message', {text: text}, function () { byId(id).value = ''; });
  }

  function wireComposer() {
    byId('btn-start').addEventListener('click', function () {
      var text = textOf('desc');
      if (!text) { byId('office-msg').textContent = 'Describe the project first.'; return; }
      act('/api/planner/start', {description: text, route: byId('route').value}, function () { byId('desc').value = ''; });
    });
    byId('btn-send').addEventListener('click', function () { send('answer'); });
    byId('btn-continue').addEventListener('click', function () { send('continue'); });
    byId('btn-implement').addEventListener('click', function () {
      if (office && office.plan_kind === 'quick') {
        if (window.confirm('Start this quick plan?')) act('/api/planner/implement', {});
        return;
      }
      var cost = office ? money(office.cost_usd) : '$?';
      var ok = window.confirm('Start implementing?\n\nThis approves the plan, has the planner write stage 1 work orders (one more Opus session turn), then starts `harness run`.\n\nPlanner cost so far: ' + cost);
      if (ok) act('/api/planner/implement', {});
    });
    byId('btn-resume').addEventListener('click', function () { act('/api/planner/start', {from_draft: true}); });
    byId('btn-fresh').addEventListener('click', function () { forcePrompt = true; renderComposer(); });
    byId('btn-new').addEventListener('click', function () { forcePrompt = true; renderComposer(); });
    byId('btn-next').addEventListener('click', function () { act('/api/planner/next-stage', {}); });
    byId('btn-resume-run').addEventListener('click', function () { act('/api/run/resume', {}); });
  }

  // ---- an agent chat in the left panel, appended in place
  function showPanel(name) {
    // the left panel shows exactly one of the Orchestrator, Opus, a timeline and a chat
    ['orch-view', 'convo', 'timeline-view', 'chat-view'].forEach(function (id) { setHidden(id, id !== name); });
  }

  function showOpus() {
    // the Opus desk: the conversation with Opus in the left panel
    selectedTask = null;
    chatTier = null;
    tlTask = null;
    showPanel('convo');
    renderOffice();
    if (office && office.can_click) focusComposer();
  }

  function openChat(chats, tier) {
    // the tier's open chat (one per tier), or null
    var list = Array.isArray(chats) ? chats : [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (c.tier === tier && (c.state === 'working' || c.state === 'waiting')) return c;
    }
    return null;
  }

  function chatSend(chat, tier, text, seed) {
    // an open chat gets a message; otherwise a new chat starts on the tier, seeded with a
    // run's task when `seed` is {run_id, task_id}
    if (chat && (chat.state === 'working' || chat.state === 'waiting')) {
      return {path: '/api/chat/message', body: {chat_id: chat.chat_id, text: text}};
    }
    var body = {tier: tier, text: text};
    if (seed) { body.run_id = seed.run_id; body.task_id = seed.task_id; }
    return {path: '/api/chat/start', body: body};
  }

  function currentChat() {
    var list = office && Array.isArray(office.chats) ? office.chats : [];
    var open = openChat(list, chatTier);
    if (open) chatId = open.chat_id;
    for (var i = 0; i < list.length; i++) {
      if (list[i].chat_id === chatId) return list[i];
    }
    return null;
  }

  function openChatPanel(tier, seed) {
    selectedTask = null;
    tlTask = null;
    chatTier = tier;
    chatId = null;
    chatSeed = seed || null;
    byId('chat-msg').textContent = '';
    showPanel('chat-view');
    renderChat();
    renderOffice();
  }

  function renderChat() {
    if (chatTier === null) return;
    var chat = currentChat();
    var ended = !!chat && (chat.state === 'closed' || chat.state === 'failed');
    byId('chat-title').textContent = chatTier + ' · ' + (chat ? chat.state : 'new chat') + (chat && chat.task_id ? ' · task ' + chat.task_id : '');
    byId('chat-cost').textContent = chat && chat.cost_usd > 0 ? money(chat.cost_usd) : '';
    var list = byId('chat-transcript');
    var entries = chat && Array.isArray(chat.transcript) ? chat.transcript : [];
    var cid = chat ? chat.chat_id : null;
    if (cid !== chatShown || entries.length < chatCount) {
      list.replaceChildren();
      chatShown = cid;
      chatCount = 0;
    }
    var left = byId('left');
    var atBottom = left.scrollHeight - left.scrollTop - left.clientHeight <= 40;
    var added = entries.length > chatCount;
    for (var i = chatCount; i < entries.length; i++) list.appendChild(msgNode(entries[i], chatTier));
    chatCount = entries.length;
    if (added && atBottom) left.scrollTop = left.scrollHeight;
    var progress = chat && chat.state === 'working' && Array.isArray(chat.progress) ? chat.progress : [];
    var ul = byId('chat-progress');
    ul.replaceChildren.apply(ul, progress.map(function (line) { return el('li', null, line); }));
    var commits = chat && Array.isArray(chat.commits) ? chat.commits : [];
    var cl = byId('chat-commits');
    cl.replaceChildren.apply(cl, commits.map(function (c) { return el('li', null, 'committed ' + c); }));
    byId('chat-note').textContent = chat && chat.error ? String(chat.error) : ended ? 'This chat has ended; sending starts a new one.' : '';
    setHidden('btn-chat-close', !chat || ended);
  }

  function followHandoff() {
    // a request Opus handed to a chat agent opens that chat, once per hand-off
    if (!interactive || !office || !office.handoff_chat || office.handoff_chat === lastHandoff) return;
    var list = Array.isArray(office.chats) ? office.chats : [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].chat_id === office.handoff_chat) {
        lastHandoff = office.handoff_chat;
        openChatPanel(list[i].tier);
        return;
      }
    }
  }

  function wireChat() {
    byId('btn-chat-back').addEventListener('click', function () { selectTask(null); });
    byId('btn-chat-send').addEventListener('click', function () {
      var text = textOf('chat-text');
      if (!text) { byId('chat-msg').textContent = 'Write a message first.'; return; }
      var req = chatSend(currentChat(), chatTier, text, chatSeed);
      act(req.path, req.body, function () { byId('chat-text').value = ''; }, 'chat-msg');
    });
    byId('btn-tl-chat').addEventListener('click', function () {
      var t = findTask(selectedTask);
      openChatPanel(chatTierOf(t ? t.tier : null), {run_id: current, task_id: selectedTask});
    });
    byId('btn-chat-close').addEventListener('click', function () {
      var chat = currentChat();
      if (chat) act('/api/chat/close', {chat_id: chat.chat_id}, null, 'chat-msg');
    });
  }

  function followLaunchedRun() {
    // Switch to the run the office launched, once; never override a run the user picked.
    if (!office || !office.run_id) return;
    if (!autoInit) {
      autoInit = true;
      if (office.state !== 'supervising' && office.state !== 'staging') { lastAutoRun = office.run_id; return; }
    }
    if (office.run_id === lastAutoRun || runs.indexOf(office.run_id) < 0) return;
    lastAutoRun = office.run_id;
    location.hash = '#' + encodeURIComponent(office.run_id);
  }

  // ---- the launcher: the open project and the folder browser (agent-orchestrator only)
  function projectSummary(p) {
    // one line about the open folder, from GET /api/project
    if (!p) return 'No project is open.';
    var bits = [];
    if (!p.is_git) bits.push('not a git repository');
    else if (!p.has_commit) bits.push('git, no commit yet');
    else bits.push(p.branch ? 'branch ' + p.branch : 'detached HEAD');
    if (p.is_git && p.has_commit && !p.on_main) bits.push('not on main');
    if (p.is_git && p.dirty) bits.push('uncommitted changes');
    if (p.origin_path) bits.push('origin ' + p.origin_path);
    return str(p.name) + ' \u00b7 ' + str(p.path) + ' \u00b7 ' + bits.join(', ');
  }

  var MAIN_VIEWS = ['layout', 'project-view'];
  function showMain(name) {
    // the page shows exactly one of the two panels and the launcher's views
    MAIN_VIEWS.forEach(function (id) { setHidden(id, id !== name); });
  }

  function errorOf(res) {
    return (res.data && res.data.error) ? String(res.data.error) : 'Request failed (HTTP ' + res.status + ')';
  }
  function projectMsg(text) { byId('project-msg').textContent = text; }

  function renderListing(l) {
    fsDir = l.path;
    byId('fs-path').value = l.path;
    byId('btn-fs-up').disabled = !l.parent;
    byId('btn-fs-up').setAttribute('data-parent', l.parent || '');
    var items = (Array.isArray(l.entries) ? l.entries : []).map(function (e) {
      var li = el('li', null, str(e.name));
      if (e.is_git) li.appendChild(el('span', 'fs-git', 'git'));
      li.setAttribute('role', 'button');
      li.tabIndex = 0;
      li.addEventListener('click', function () { browse(e.path); });
      li.addEventListener('keydown', onKey(function () { browse(e.path); }));
      return li;
    });
    if (!items.length) items.push(el('li', 'muted', 'No subfolders'));
    if (l.truncated) items.push(el('li', 'muted', 'Only the first folders are shown; type a path to go further.'));
    var ul = byId('fs-list');
    ul.replaceChildren.apply(ul, items);
  }

  function browse(path) {
    api('/api/project/browse', {path: path, hidden: byId('fs-hidden').checked}).then(function (res) {
      if (!res.ok) { projectMsg(errorOf(res)); return; }
      projectMsg('');
      renderListing(res.data);
    }).catch(function () { projectMsg('Connection lost; try again.'); });
  }

  function openFolder(path) {
    api('/api/project/open', {path: path}).then(function (res) {
      if (!res.ok) { projectMsg(errorOf(res)); return; }
      location.reload();
    }).catch(function () { projectMsg('Connection lost; try again.'); });
  }

  function renderRecent() {
    var items = recent.map(function (path) {
      var li = el('li', null, path);
      li.setAttribute('role', 'button');
      li.tabIndex = 0;
      li.addEventListener('click', function () { openFolder(path); });
      li.addEventListener('keydown', onKey(function () { openFolder(path); }));
      return li;
    });
    var ul = byId('recent-list');
    ul.replaceChildren.apply(ul, items);
  }

  function applyProject(p) {
    hostMode = true;
    project = p.project || null;
    recent = Array.isArray(p.recent) ? p.recent : [];
    serverStarted = p.started;
    byId('project-name').textContent = project ? str(project.name) : 'no project';
    byId('project-name').setAttribute('title', project ? str(project.path) : '');
    setHidden('project-name', false);
    setHidden('btn-switch-project', !project);
    setHidden('btn-project-back', !project);
    byId('project-info').textContent = projectSummary(project);
    renderRecent();
    if (!project) {
      showMain('project-view');
      if (fsDir === null) browse(str(p.cwd));
    }
  }

  function loadProject() {
    // 404 means a plain `harness ui` server: the page stays as it was
    fetch('/api/project').then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
      if (p && typeof p === 'object' && 'project' in p) applyProject(p);
    }).catch(function () { /* not a launcher server */ });
  }

  function wireProject() {
    byId('btn-switch-project').addEventListener('click', function () {
      projectMsg('');
      showMain('project-view');
      var path = project ? str(project.path) : fsDir;
      var cut = path ? path.replace(/[\/\\][^\/\\]*$/, '') : '';
      browse(fsDir === null ? (cut || path) : fsDir);
    });
    byId('btn-project-back').addEventListener('click', function () { showMain('layout'); });
    byId('btn-fs-up').addEventListener('click', function () {
      var up = byId('btn-fs-up').getAttribute('data-parent');
      if (up) browse(up);
    });
    byId('btn-fs-go').addEventListener('click', function () { browse(byId('fs-path').value); });
    byId('fs-path').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); browse(byId('fs-path').value); }
    });
    byId('fs-hidden').addEventListener('change', function () { if (fsDir) browse(fsDir); });
    byId('btn-fs-open').addEventListener('click', function () { if (fsDir) openFolder(fsDir); });
  }

  function applyOffice(o) {
    var sig = JSON.stringify(o);
    if (sig === officeSig) return;
    officeSig = sig;
    office = o;
    followLaunchedRun();
    followHandoff();
    renderOffice();
    renderTranscript(o);
    renderOrch(o.orchestrator);
    byId('office-total').textContent = totalText(o);
    renderComposer();
    renderChat();
  }

  function pollOffice() {
    if (hostMode && !project) return;
    fetch('/api/office').then(function (r) { return r.json(); }).then(function (o) {
      if (o && typeof o.state === 'string') applyOffice(o);
    }).catch(function () { /* next poll retries */ });
  }

  function render(v) {
    stopped = v.stopped_reason || null;
    idle = (typeof v.idle_minutes === 'number') ? v.idle_minutes : null;
    document.getElementById('stage').textContent = str(v.stage);
    var ph = document.getElementById('phase');
    ph.className = 'phase phase-' + str(v.phase);
    ph.textContent = str(v.phase);
    document.getElementById('wave').textContent = 'wave ' + num(v.wave) + '/' + num(v.waves_total);
    document.getElementById('cost').textContent = money(v.cost_usd);
    var tiers = document.getElementById('tiers');
    var chips = [];
    (v.tiers || []).forEach(function (t) {
      var n = t.attempts;
      chips.push(el('span', 'chip', str(t.tier) + ' ' + num(n) + (n === 1 ? ' attempt ' : ' attempts ') + money(t.cost_usd)));
    });
    tiers.replaceChildren.apply(tiers, chips);

    var rows = [];
    (v.tasks || []).forEach(function (t) {
      var tr = el('tr');
      var c = el('td');
      c.appendChild(el('strong', null, str(t.task_id)));
      c.appendChild(document.createTextNode(' ' + (t.title === null || t.title === undefined ? '' : t.title)));
      tr.appendChild(c);
      var s = el('td');
      s.appendChild(el('span', 'status status-' + str(t.status), str(t.status)));
      tr.appendChild(s);
      tr.appendChild(el('td', null, (t.tier ? t.tier : '-') + (t.escalated ? ' (escalated)' : '')));
      var max = (t.max_attempts === null || t.max_attempts === undefined) ? '?' : num(t.max_attempts);
      tr.appendChild(el('td', null, num(t.attempt) + '/' + max));
      tr.appendChild(el('td', null, num(t.input_tokens) + ' in / ' + num(t.output_tokens) + ' out'));
      tr.appendChild(el('td', null, money(t.cost_usd)));
      tr.appendChild(noteCell(t));
      rows.push(tr);
    });
    var body = document.querySelector('#tasks tbody');
    body.replaceChildren.apply(body, rows);

    var items = [];
    (v.events || []).slice().reverse().forEach(function (e) {
      var li = el('li', 'ev type-' + str(e.type));
      li.appendChild(el('span', 'time', typeof e.ts === 'string' ? e.ts.slice(11, 19) : '?'));
      var text = e.text === null || e.text === undefined ? '' : String(e.text);
      if (needsTid(e.task_id, text)) li.appendChild(el('span', 'tid mono', String(e.task_id)));
      li.appendChild(document.createTextNode(text));
      items.push(li);
    });
    var feed = document.getElementById('feed');
    feed.replaceChildren.apply(feed, items);
    runView = v;
    renderOffice();
    renderTimeline();
    renderBanner();
  }

  function closeSource() {
    if (source) { source.close(); source = null; }
  }

  function open(id) {
    closeSource();
    current = id;
    conn = false; problem = null; stopped = null; idle = null;
    runView = null;
    selectTask(null);
    renderBanner();
    if (!id) return;
    source = new EventSource('/api/stream/' + encodeURIComponent(id));
    source.onopen = function () { conn = false; renderBanner(); };
    source.onmessage = function (ev) {
      var v;
      try { v = JSON.parse(ev.data); } catch (e) { return; }
      conn = false; problem = null;
      try { render(v); } catch (e) { /* keep the previous view */ }
    };
    source.addEventListener('problem', function (ev) {
      var msg = '?';
      try { msg = String(JSON.parse(ev.data).error); } catch (e) { /* keep ? */ }
      problem = msg;
      renderBanner();
    });
    source.onerror = function () { conn = true; renderBanner(); };
  }

  function choose() {
    var h = hashId();
    var id = (h && runs.indexOf(h) >= 0) ? h : latest;
    if (!id) id = null;
    if (id !== current) open(id);
    picker.value = id || '';
  }

  function renderRuns() {
    var empty = runs.length === 0;
    document.getElementById('empty').className = empty ? '' : 'hidden';
    document.getElementById('content').className = empty ? 'hidden' : '';
    document.querySelector('header').className = (empty && !interactive) ? 'hidden' : '';
    var opts = runs.map(function (r) { return el('option', null, r); });
    picker.replaceChildren.apply(picker, opts);
    opts.forEach(function (o) { o.value = o.textContent; });
  }

  function poll() {
    if (hostMode && !project) return;
    fetch('/api/runs').then(function (r) { return r.json(); }).then(function (d) {
      runs = Array.isArray(d.runs) ? d.runs : [];
      latest = d.latest || null;
      renderRuns();
      followLaunchedRun();
      choose();
    }).catch(function () { /* next poll retries */ });
  }

  picker.addEventListener('change', function () { location.hash = '#' + encodeURIComponent(picker.value); });
  window.addEventListener('hashchange', choose);
  renderRuns();
  renderOffice();
  wireComposer();
  wireChat();
  wireOrch();
  wireProject();
  byId('btn-back-opus').addEventListener('click', function () { selectTask(null); });
  byId('btn-convo-back').addEventListener('click', function () { selectTask(null); });
  loadProject();
  poll();
  setInterval(poll, 2000);
  pollOffice();
  setInterval(pollOffice, 1000);
})();
</script>
</body>
</html>
