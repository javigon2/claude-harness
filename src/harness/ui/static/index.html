<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="harness-token" content="">
<meta name="harness-mode" content="read-only">
<title>Harness office</title>
<style>
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; color: #222; background: #fafafa; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #ddd; }
main { padding: 12px 16px; }
.chip { border: 1px solid #ccc; border-radius: 10px; padding: 1px 8px; font-size: 13px; background: #f4f4f4; }
.phase { font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.phase-running { background: #dbeafe; color: #1e40af; }
.phase-stopped { background: #fde68a; color: #78350f; }
.phase-finished { background: #d1fae5; color: #065f46; }
#banner { padding: 8px 16px; background: #fff3cd; border-bottom: 1px solid #e0c36a; }
#banner:empty { display: none; }
table { border-collapse: collapse; width: 100%; background: #fff; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #e5e5e5; vertical-align: top; font-size: 14px; }
th { background: #f0f0f0; }
.status { font-weight: 600; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
.status-pending { background: #e5e7eb; color: #4b5563; }
.status-running { background: #dbeafe; color: #1d4ed8; }
.status-verifying { background: #ede9fe; color: #6d28d9; }
.status-done { background: #d1fae5; color: #047857; }
.status-failed { background: #fee2e2; color: #b91c1c; }
.status-blocked { background: #f5c6c6; color: #7f1d1d; }
.status-paused { background: #fef3c7; color: #92400e; }
.activity, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.activity { color: #6b7280; font-size: 13px; }
pre { white-space: pre-wrap; margin: 4px 0 0; }
#feed { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; }
#feed li { padding: 2px 0; border-bottom: 1px solid #eee; }
#feed .time { color: #6b7280; margin-right: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; }
#feed .tid { margin-right: 6px; }
.hidden { display: none; }
#office { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; padding: 8px 0 14px; }
.desk { position: relative; width: 132px; padding-top: 74px; text-align: center; }
.desk-label { font-size: 12px; margin-top: 6px; color: #374151; word-break: break-all; }
.desk-top { height: 30px; border-radius: 4px; border: 2px solid #9ca3af; background: #e5e7eb; position: relative; }
.desk-top::before { content: ""; position: absolute; left: 50%; top: -14px; width: 26px; height: 12px; margin-left: -13px; border: 2px solid #9ca3af; border-radius: 2px; background: #f9fafb; }
.worker { position: absolute; left: 50%; top: 34px; width: 28px; margin-left: -14px; height: 40px; display: none; }
.worker::before { content: ""; position: absolute; left: 7px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #6b7280; }
.worker::after { content: ""; position: absolute; left: 2px; top: 16px; width: 24px; height: 20px; border-radius: 10px 10px 0 0; background: #6b7280; }
.desk-running .worker, .desk-verifying .worker, .desk-paused .worker, .desk-done .worker, .desk-failed .worker, .desk-blocked .worker, .desk-boss .worker { display: block; }
.desk-done .worker, .desk-failed .worker, .desk-blocked .worker { opacity: 0.45; }
.desk-pending .desk-top { border-style: dashed; background: #f3f4f6; border-color: #d1d5db; }
.desk-running .desk-top { border-color: #2563eb; background: #dbeafe; }
.desk-verifying .desk-top { border-color: #7c3aed; background: #ede9fe; }
.desk-done .desk-top { border-color: #059669; background: #a7f3d0; }
.desk-failed .desk-top { border-color: #dc2626; background: #fecaca; }
.desk-blocked .desk-top { border-color: #991b1b; background: #fca5a5; }
.desk-paused .desk-top { border-color: #d97706; background: #fde68a; }
.desk-boss .desk-top { border-color: #374151; background: #d1d5db; }
.desk-boss .worker::before, .desk-boss .worker::after { background: #1f2937; }
.bubble { position: absolute; left: 0; right: 0; top: 0; min-height: 18px; padding: 2px 6px; border: 1px solid #9ca3af; border-radius: 8px; background: #fff; font-size: 11px; line-height: 14px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; width: 8px; height: 8px; background: #fff; border-right: 1px solid #9ca3af; border-bottom: 1px solid #9ca3af; transform: rotate(45deg); }
.bubble-running { border-color: #2563eb; }
.bubble-verifying { border-color: #7c3aed; }
.bubble-paused { border-color: #d97706; }
.desk-boss.clickable { cursor: pointer; }
.desk-boss.clickable:hover .desk-top { filter: brightness(0.94); }
.boss-busy .desk-top, .boss-staging .desk-top { border-color: #2563eb; background: #dbeafe; }
.boss-asking .desk-top { border-color: #d97706; background: #fde68a; }
.boss-ready .desk-top { animation: flash 1s infinite; }
@keyframes flash { 0%, 100% { background: #d1d5db; } 50% { background: #fde047; } }
.boss-supervising .desk-top { border-color: #059669; background: #a7f3d0; }
.boss-failed .desk-top { border-color: #dc2626; background: #fecaca; }
.boss-interrupted .desk-top { border-color: #d97706; background: #fed7aa; }
.boss-terminal .desk-top { border-color: #7c3aed; background: #ede9fe; }
.bubble-boss { border-color: #374151; }
.boss-ready .bubble-boss, .boss-asking .bubble-boss { border-color: #d97706; font-weight: 600; }
.muted { color: #6b7280; }
dialog#office-modal { width: min(900px, 94vw); max-height: 88vh; overflow: auto; border: 1px solid #9ca3af; border-radius: 8px; padding: 14px 18px; }
dialog#office-modal::backdrop { background: rgba(0, 0, 0, 0.35); }
.modal-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; }
.modal-head .grow { flex: 1; }
#office-msg { color: #b91c1c; font-weight: 600; min-height: 1em; }
#office-msg:empty { display: none; }
#office-note { color: #78350f; background: #fff3cd; padding: 4px 8px; border-radius: 4px; }
#office-note:empty { display: none; }
dialog#office-modal textarea { width: 100%; box-sizing: border-box; font: inherit; margin: 6px 0; }
dialog#office-modal button { font: inherit; padding: 4px 12px; margin-right: 8px; cursor: pointer; }
dialog#office-modal button:disabled { cursor: default; opacity: 0.55; }
.md { font-size: 14px; line-height: 1.45; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 14px 0 6px; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
.md p { margin: 6px 0; }
.md li > p { margin: 0; }
.md table { width: auto; margin: 8px 0; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #f3f4f6; padding: 0 3px; border-radius: 3px; }
.md pre { background: #f3f4f6; padding: 8px; border-radius: 4px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid #d1d5db; color: #4b5563; }
.scroll { max-height: 46vh; overflow: auto; border: 1px solid #e5e7eb; border-radius: 4px; padding: 4px 10px; background: #fff; }
#progress { list-style: none; padding: 0; margin: 6px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #4b5563; }
details.fold { margin-top: 10px; }
details.fold > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<header>
  <select id="run-picker" aria-label="Run"></select>
  <span id="stage"></span>
  <span id="phase" class="phase"></span>
  <span id="wave"></span>
  <span id="cost"></span>
  <span id="tiers"></span>
</header>
<div id="banner"></div>
<main>
  <div id="office" aria-label="Office"></div>
  <p id="empty" class="hidden">No runs yet</p>
  <div id="content">
    <details class="fold" open>
      <summary>Tasks</summary>
      <table id="tasks">
        <thead><tr><th>Task</th><th>Status</th><th>Tier</th><th>Attempt</th><th>Tokens</th><th>Cost</th><th>Note</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>
    <details class="fold" open>
      <summary>Events</summary>
      <ol id="feed"></ol>
    </details>
  </div>
</main>
<dialog id="office-modal" aria-labelledby="office-title">
  <div class="modal-head">
    <strong id="office-title">Planner</strong>
    <span id="office-cost" class="muted"></span>
    <span class="grow"></span>
    <button id="office-close" type="button">Close</button>
  </div>
  <p id="office-note"></p>
  <p id="office-msg" role="alert"></p>
  <section id="sec-prompt" class="hidden">
    <label for="desc">What should the planner plan?</label>
    <textarea id="desc" rows="7" placeholder="Describe the project in a few sentences"></textarea>
    <button id="btn-start" type="button">Start planning</button>
  </section>
  <section id="sec-status" class="hidden">
    <p id="status-line"></p>
    <ul id="progress"></ul>
  </section>
  <section id="sec-reply" class="hidden">
    <div id="reply-body" class="md scroll"></div>
    <textarea id="answer" rows="4" placeholder="Your answer"></textarea>
    <button id="btn-send" type="button">Send</button>
    <button id="btn-view-plan" type="button" class="hidden">View plan</button>
  </section>
  <section id="sec-plan" class="hidden">
    <div id="plan-reply" class="md scroll"></div>
    <h3>Plan</h3>
    <div id="plan-body" class="md scroll"></div>
    <textarea id="continue" rows="3" placeholder="Ask for changes"></textarea>
    <button id="btn-continue" type="button">Continue conversation</button>
    <button id="btn-implement" type="button">Start implementing</button>
    <button id="btn-back" type="button" class="hidden">Back to the question</button>
  </section>
  <section id="sec-failed" class="hidden">
    <p id="failed-line"></p>
    <button id="btn-resume" type="button">Continue from draft</button>
    <button id="btn-fresh" type="button">Start fresh</button>
    <div id="draft-body" class="md scroll"></div>
  </section>
  <section id="sec-next" class="hidden">
    <p id="next-line"></p>
    <button id="btn-next" type="button">Plan next stage</button>
    <button id="btn-new" type="button">New project</button>
  </section>
</dialog>
<script>
(function () {
  var picker = document.getElementById('run-picker');
  var runs = [], latest = null, current = null, source = null;
  var conn = false, problem = null, stopped = null, idle = null;
  var tokenMeta = document.querySelector('meta[name="harness-token"]');
  var modeMeta = document.querySelector('meta[name="harness-mode"]');
  var token = tokenMeta ? (tokenMeta.getAttribute('content') || '') : '';
  var interactive = !!modeMeta && modeMeta.getAttribute('content') === 'interactive';
  var office = null, officeSig = '', runView = null, planBlocks = null, planSeq = 0, planKey = '';
  var forcePrompt = false, showPlan = false, modal = document.getElementById('office-modal');

  function needsTid(id, text) {
    // describe text already starts with the task id (e.g. "a started on haiku")
    return id !== null && id !== undefined && String(text).indexOf(String(id) + ' ') !== 0;
  }
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function num(x) { return (x === null || x === undefined || isNaN(Number(x))) ? '?' : String(x); }
  function money(x) { return (x === null || x === undefined || isNaN(Number(x))) ? '$?' : '$' + Number(x).toFixed(4); }
  function str(x) { return (x === null || x === undefined) ? '?' : String(x); }

  function hashId() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return '';
    try { return decodeURIComponent(h); } catch (e) { return h; }
  }

  function renderBanner() {
    var b = document.getElementById('banner');
    var msg = '';
    if (conn) msg = 'Connection lost, retrying...';
    else if (problem !== null) msg = 'Problem reading the run: ' + problem;
    else if (idle !== null) msg = 'No activity for ' + idle + ' min, the process may have crashed.';
    else if (stopped) msg = 'Stopped early: ' + stopped + '. Resume from the terminal with `harness run <plan> --repo <repo> --resume`.';
    b.textContent = msg;
  }

  function noteCell(t) {
    var td = el('td');
    var d = t.detail;
    if (t.status === 'running' && t.activity) {
      td.appendChild(el('span', 'activity', t.activity));
    } else if (t.status === 'paused' && d !== null && d !== undefined) {
      td.appendChild(document.createTextNode(String(d)));
    } else if (t.status !== 'running' && t.status !== 'paused' && d !== null && d !== undefined) {
      var det = el('details');
      det.appendChild(el('summary', null, 'details'));
      det.appendChild(el('pre', null, String(d)));
      td.appendChild(det);
    }
    return td;
  }

  function desk(kind, label, status, activity) {
    var d = el('div', 'desk desk-' + kind);
    if (status === 'running' || status === 'verifying' || status === 'paused') {
      var text = (status === 'paused') ? 'paused' : (activity ? activity : 'awaiting');
      d.appendChild(el('div', 'bubble bubble-' + status, text));
    }
    d.appendChild(el('div', 'worker'));
    d.appendChild(el('div', 'desk-top'));
    d.appendChild(el('div', 'desk-label', label));
    return d;
  }

  function bossText(o) {
    var st = o.state;
    if (st === 'busy') return (o.progress && o.progress.length) ? o.progress[o.progress.length - 1] : 'thinking\u2026';
    if (st === 'asking') return 'has a question';
    if (st === 'ready') return 'plan ready!';
    if (st === 'staging') return 'writing work orders';
    if (st === 'supervising') return 'supervising ' + str(o.run_id);
    if (st === 'interrupted') return 'interrupted';
    if (st === 'failed') return 'failed';
    if (st === 'terminal') return 'busy (terminal)';
    return '';
  }

  function bossDesk() {
    var o = office || {state: 'idle', can_click: false};
    var clickable = interactive && !!o.can_click;
    var d = el('div', 'desk desk-boss boss-' + str(o.state) + (clickable ? ' clickable' : ''));
    var text = bossText(o);
    if (text) d.appendChild(el('div', 'bubble bubble-boss', text));
    d.appendChild(el('div', 'worker'));
    d.appendChild(el('div', 'desk-top'));
    d.appendChild(el('div', 'desk-label', 'planner'));
    if (clickable) {
      d.setAttribute('role', 'button');
      d.setAttribute('title', 'Talk to the planner');
      d.tabIndex = 0;
      d.addEventListener('click', openModal);
      d.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openModal(); } });
    }
    return d;
  }

  function renderOffice() {
    var desks = [bossDesk()];
    if (runView) {
      (runView.tasks || []).forEach(function (t) {
        var st = str(t.status);
        desks.push(desk(st, (t.tier ? t.tier : '-') + ' \u00b7 ' + str(t.task_id), st, t.activity));
      });
    }
    var officeEl = document.getElementById('office');
    officeEl.replaceChildren.apply(officeEl, desks);
  }

  // ---- markdown block tree -> DOM (textContent only; links are never anchors)
  function inlineNode(sp) {
    var t = sp.t, text = (sp.text === null || sp.text === undefined) ? '' : String(sp.text);
    if (t === 'strong') return el('strong', null, text);
    if (t === 'em') return el('em', null, text);
    if (t === 'code') return el('code', null, text);
    if (t === 'link') {
      var f = document.createDocumentFragment();
      f.appendChild(document.createTextNode(text));
      f.appendChild(el('span', 'muted', ' (' + str(sp.href) + ')'));
      return f;
    }
    return document.createTextNode(text);
  }
  function appendInline(parent, spans) {
    (Array.isArray(spans) ? spans : []).forEach(function (sp) { parent.appendChild(inlineNode(sp)); });
  }
  function renderBlock(b) {
    var type = b && b.type, n, i;
    if (type === 'heading') {
      var lv = Math.min(6, Math.max(1, Number(b.level) || 1));
      n = el('h' + lv);
      appendInline(n, b.inline);
      return n;
    }
    if (type === 'paragraph') {
      n = el('p');
      appendInline(n, b.inline);
      return n;
    }
    if (type === 'list') {
      n = el(b.ordered ? 'ol' : 'ul');
      (b.items || []).forEach(function (blocks) {
        var li = el('li');
        li.appendChild(renderBlocks(blocks));
        n.appendChild(li);
      });
      return n;
    }
    if (type === 'code') {
      n = el('pre');
      n.appendChild(el('code', null, str(b.text)));
      return n;
    }
    if (type === 'table') {
      n = el('table');
      var head = el('tr');
      (b.header || []).forEach(function (cell) { var th = el('th'); appendInline(th, cell); head.appendChild(th); });
      var thead = el('thead');
      thead.appendChild(head);
      n.appendChild(thead);
      var tbody = el('tbody');
      (b.rows || []).forEach(function (row) {
        var tr = el('tr');
        for (i = 0; i < row.length; i++) { var td = el('td'); appendInline(td, row[i]); tr.appendChild(td); }
        tbody.appendChild(tr);
      });
      n.appendChild(tbody);
      return n;
    }
    if (type === 'quote') {
      n = el('blockquote');
      n.appendChild(renderBlocks(b.blocks));
      return n;
    }
    if (type === 'hr') return el('hr');
    return null;
  }
  function renderBlocks(blocks) {
    var frag = document.createDocumentFragment();
    (Array.isArray(blocks) ? blocks : []).forEach(function (b) {
      var n = renderBlock(b);
      if (n) frag.appendChild(n);
    });
    return frag;
  }
  function fill(id, blocks) {
    var node = document.getElementById(id);
    node.replaceChildren(renderBlocks(blocks));
  }

  // ---- the boss's modal
  function byId(id) { return document.getElementById(id); }
  function setHidden(id, hide) { byId(id).classList.toggle('hidden', hide); }

  function pickSection(o) {
    var st = o.state;
    if (st === 'idle') return (o.next_stage && !forcePrompt) ? 'next' : 'prompt';
    if (st === 'interrupted' || st === 'failed') return forcePrompt ? 'prompt' : 'failed';
    if (st === 'asking') return (showPlan && o.plan_exists) ? 'plan' : 'reply';
    if (st === 'ready') return 'plan';
    return 'status';
  }

  function statusLine(o) {
    if (o.state === 'busy') return 'The planner is working\u2026';
    if (o.state === 'staging') return 'The planner is writing the stage work orders\u2026';
    if (o.state === 'supervising') return 'Supervising run ' + str(o.run_id) + '. Planning is paused until it finishes.';
    if (o.state === 'terminal') return 'A planner is busy in a terminal; wait for it to finish.';
    return str(o.state);
  }

  function renderModal() {
    var o = office;
    if (!o || !modal) return;
    if (o.state !== 'idle' && o.state !== 'interrupted' && o.state !== 'failed') forcePrompt = false;
    if (o.state !== 'asking') showPlan = false;
    var which = pickSection(o);
    ['prompt', 'status', 'reply', 'plan', 'failed', 'next'].forEach(function (name) {
      setHidden('sec-' + name, name !== which);
    });
    byId('office-title').textContent = 'Planner \u00b7 ' + str(o.state) + (o.stage ? ' (stage ' + o.stage + ')' : '');
    byId('office-cost').textContent = o.cost_usd > 0 ? 'planner cost ' + money(o.cost_usd) : '';
    byId('office-note').textContent = o.error ? String(o.error) : '';
    if (which === 'status') {
      byId('status-line').textContent = statusLine(o);
      var items = (o.progress || []).map(function (line) { return el('li', null, line); });
      var ul = byId('progress');
      ul.replaceChildren.apply(ul, items);
    }
    if (which === 'reply') {
      fill('reply-body', o.reply_blocks);
      setHidden('btn-view-plan', !o.plan_exists);
    }
    if (which === 'plan') {
      fill('plan-reply', o.reply_blocks);
      setHidden('btn-back', o.state !== 'asking');
      setHidden('btn-implement', o.plan_status !== 'draft');
      fillPlan();
    }
    if (which === 'failed') {
      byId('failed-line').textContent = o.state === 'failed' ? 'The planner stopped.' : 'The planning session was closed.';
      setHidden('btn-resume', !o.plan_exists);
      fillPlan();
    }
    if (which === 'next') {
      byId('next-line').textContent = 'The last run finished. Plan the next stage of the approved project plan, or start a new project.';
      byId('btn-next').textContent = 'Plan next stage (' + str(o.next_stage) + ')';
    }
    var key = [which, o.plan_status, o.state, o.cost_usd].join('|');
    if (modal.open && o.plan_exists && (which === 'plan' || which === 'failed') && key !== planKey) {
      planKey = key;
      loadPlan();
    }
  }

  function fillPlan() {
    if (planBlocks === null) return;
    fill('plan-body', planBlocks);
    fill('draft-body', planBlocks);
  }

  function loadPlan() {
    var seq = ++planSeq;
    fetch('/api/plan').then(function (r) { return r.json(); }).then(function (p) {
      if (seq !== planSeq) return;
      planBlocks = (p && p.exists && Array.isArray(p.blocks)) ? p.blocks : [];
      fillPlan();
    }).catch(function () { /* the next change retries */ });
  }

  function openModal() {
    if (!modal || !interactive) return;
    byId('office-msg').textContent = '';
    planKey = '';
    renderModal();
    if (!modal.open) {
      if (typeof modal.showModal === 'function') modal.showModal();
      else modal.setAttribute('open', '');
    }
    renderModal();
  }

  function setBusy(on) {
    var buttons = modal.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].id !== 'office-close') buttons[i].disabled = on;
    }
  }

  function api(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Harness-Token': token},
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        var data = null;
        try { data = JSON.parse(t); } catch (e) { data = null; }
        return {ok: r.ok, status: r.status, data: data};
      });
    });
  }

  function act(path, body, done) {
    var msg = byId('office-msg');
    msg.textContent = '';
    setBusy(true);
    api(path, body).then(function (res) {
      setBusy(false);
      if (!res.ok) {
        msg.textContent = (res.data && res.data.error) ? String(res.data.error) : 'Request failed (HTTP ' + res.status + ')';
        return;
      }
      if (done) done();
      if (res.data && res.data.office) applyOffice(res.data.office);
    }).catch(function () {
      setBusy(false);
      msg.textContent = 'Connection lost; try again.';
    });
  }

  function textOf(id) { return byId(id).value.replace(/^\s+|\s+$/g, ''); }

  function send(id) {
    var text = textOf(id);
    if (!text) { byId('office-msg').textContent = 'Write a message first.'; return; }
    act('/api/planner/message', {text: text}, function () { byId(id).value = ''; });
  }

  function wireModal() {
    byId('office-close').addEventListener('click', function () { modal.close(); });
    byId('btn-start').addEventListener('click', function () {
      var text = textOf('desc');
      if (!text) { byId('office-msg').textContent = 'Describe the project first.'; return; }
      act('/api/planner/start', {description: text}, function () { byId('desc').value = ''; });
    });
    byId('btn-send').addEventListener('click', function () { send('answer'); });
    byId('btn-continue').addEventListener('click', function () { send('continue'); });
    byId('btn-view-plan').addEventListener('click', function () { showPlan = true; planKey = ''; renderModal(); });
    byId('btn-back').addEventListener('click', function () { showPlan = false; renderModal(); });
    byId('btn-implement').addEventListener('click', function () {
      var cost = office ? money(office.cost_usd) : '$?';
      var ok = window.confirm('Start implementing?\n\nThis approves the plan, has the planner write stage 1 work orders (one more Opus session turn), then starts `harness run`.\n\nPlanner cost so far: ' + cost);
      if (ok) act('/api/planner/implement', {});
    });
    byId('btn-resume').addEventListener('click', function () { act('/api/planner/start', {from_draft: true}); });
    byId('btn-fresh').addEventListener('click', function () { forcePrompt = true; renderModal(); });
    byId('btn-new').addEventListener('click', function () { forcePrompt = true; renderModal(); });
    byId('btn-next').addEventListener('click', function () { act('/api/planner/next-stage', {}); });
  }

  function applyOffice(o) {
    var sig = JSON.stringify(o);
    if (sig === officeSig) return;
    officeSig = sig;
    office = o;
    renderOffice();
    if (modal && modal.open) renderModal();
  }

  function pollOffice() {
    fetch('/api/office').then(function (r) { return r.json(); }).then(function (o) {
      if (o && typeof o.state === 'string') applyOffice(o);
    }).catch(function () { /* next poll retries */ });
  }

  function render(v) {
    stopped = v.stopped_reason || null;
    idle = (typeof v.idle_minutes === 'number') ? v.idle_minutes : null;
    document.getElementById('stage').textContent = str(v.stage);
    var ph = document.getElementById('phase');
    ph.className = 'phase phase-' + str(v.phase);
    ph.textContent = str(v.phase);
    document.getElementById('wave').textContent = 'wave ' + num(v.wave) + '/' + num(v.waves_total);
    document.getElementById('cost').textContent = money(v.cost_usd);
    var tiers = document.getElementById('tiers');
    var chips = [];
    (v.tiers || []).forEach(function (t) {
      var n = t.attempts;
      chips.push(el('span', 'chip', str(t.tier) + ' ' + num(n) + (n === 1 ? ' attempt ' : ' attempts ') + money(t.cost_usd)));
    });
    tiers.replaceChildren.apply(tiers, chips);

    var rows = [];
    (v.tasks || []).forEach(function (t) {
      var tr = el('tr');
      var c = el('td');
      c.appendChild(el('strong', null, str(t.task_id)));
      c.appendChild(document.createTextNode(' ' + (t.title === null || t.title === undefined ? '' : t.title)));
      tr.appendChild(c);
      var s = el('td');
      s.appendChild(el('span', 'status status-' + str(t.status), str(t.status)));
      tr.appendChild(s);
      tr.appendChild(el('td', null, (t.tier ? t.tier : '-') + (t.escalated ? ' (escalated)' : '')));
      var max = (t.max_attempts === null || t.max_attempts === undefined) ? '?' : num(t.max_attempts);
      tr.appendChild(el('td', null, num(t.attempt) + '/' + max));
      tr.appendChild(el('td', null, num(t.input_tokens) + ' in / ' + num(t.output_tokens) + ' out'));
      tr.appendChild(el('td', null, money(t.cost_usd)));
      tr.appendChild(noteCell(t));
      rows.push(tr);
    });
    var body = document.querySelector('#tasks tbody');
    body.replaceChildren.apply(body, rows);

    var items = [];
    (v.events || []).slice().reverse().forEach(function (e) {
      var li = el('li', 'ev type-' + str(e.type));
      li.appendChild(el('span', 'time', typeof e.ts === 'string' ? e.ts.slice(11, 19) : '?'));
      var text = e.text === null || e.text === undefined ? '' : String(e.text);
      if (needsTid(e.task_id, text)) li.appendChild(el('span', 'tid mono', String(e.task_id)));
      li.appendChild(document.createTextNode(text));
      items.push(li);
    });
    var feed = document.getElementById('feed');
    feed.replaceChildren.apply(feed, items);
    runView = v;
    renderOffice();
    renderBanner();
  }

  function closeSource() {
    if (source) { source.close(); source = null; }
  }

  function open(id) {
    closeSource();
    current = id;
    conn = false; problem = null; stopped = null; idle = null;
    runView = null;
    renderOffice();
    renderBanner();
    if (!id) return;
    source = new EventSource('/api/stream/' + encodeURIComponent(id));
    source.onopen = function () { conn = false; renderBanner(); };
    source.onmessage = function (ev) {
      var v;
      try { v = JSON.parse(ev.data); } catch (e) { return; }
      conn = false; problem = null;
      try { render(v); } catch (e) { /* keep the previous view */ }
    };
    source.addEventListener('problem', function (ev) {
      var msg = '?';
      try { msg = String(JSON.parse(ev.data).error); } catch (e) { /* keep ? */ }
      problem = msg;
      renderBanner();
    });
    source.onerror = function () { conn = true; renderBanner(); };
  }

  function choose() {
    var h = hashId();
    var id = (h && runs.indexOf(h) >= 0) ? h : latest;
    if (!id) id = null;
    if (id !== current) open(id);
    picker.value = id || '';
  }

  function renderRuns() {
    var empty = runs.length === 0;
    document.getElementById('empty').className = empty ? '' : 'hidden';
    document.getElementById('content').className = empty ? 'hidden' : '';
    document.querySelector('header').className = empty ? 'hidden' : '';
    var opts = runs.map(function (r) { return el('option', null, r); });
    picker.replaceChildren.apply(picker, opts);
    opts.forEach(function (o) { o.value = o.textContent; });
  }

  function poll() {
    fetch('/api/runs').then(function (r) { return r.json(); }).then(function (d) {
      runs = Array.isArray(d.runs) ? d.runs : [];
      latest = d.latest || null;
      renderRuns();
      choose();
    }).catch(function () { /* next poll retries */ });
  }

  picker.addEventListener('change', function () { location.hash = '#' + encodeURIComponent(picker.value); });
  window.addEventListener('hashchange', choose);
  renderRuns();
  renderOffice();
  if (modal) wireModal();
  poll();
  setInterval(poll, 2000);
  pollOffice();
  setInterval(pollOffice, 1000);
})();
</script>
</body>
</html>
